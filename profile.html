<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card shadow p-5">

<h2>User Profile</h2>

<hr>

<h4 id="userName"></h4>

<p id="userEmail"></p>

<button
class="btn btn-danger"
onclick="logout()">
Logout
</button>

</div>

</div>

<script>

let user =
JSON.parse(
localStorage.getItem(
"loggedInUser"
)
);

if(user){

document.getElementById(
"userName"
).innerText =
user.name;

document.getElementById(
"userEmail"
).innerText =
user.email;

}
else{

window.location.href =
"login.html";

}

function logout(){

localStorage.removeItem(
"loggedInUser"
);

window.location.href =
"login.html";

}

</script>

</body>
</html>
